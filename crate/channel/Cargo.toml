[package]
name = "sourcetrait_grammar_channel"
description = "Grammar's Channel"
version.workspace    = true
authors.workspace    = true
license.workspace    = true
edition.workspace    = true
repository.workspace = true
homepage.workspace   = true
categories.workspace = true
keywords.workspace   = true

[dependencies]
bitcode.workspace = true
# nuon takes nu-engine without `os` while nu-protocol keeps it, and nu-engine
# builds only with the two paired, so its defaults pair them.
nu-engine.workspace = true
nu-protocol.workspace = true
nuon.workspace = true
nuval = { workspace = true, features = ["nushell"] }
rkyv.workspace = true
serde.workspace = true
tokio.workspace = true

sourcetrait_common.workspace = true
sourcetrait_grammar_protocol.workspace = true

[package.metadata]
rein = "ai"
