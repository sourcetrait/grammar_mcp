[package]
name = "sourcetrait_grammar_daemon"
description = "Grammar's remote worker, an SSH session's command"
version.workspace    = true
authors.workspace    = true
license.workspace    = true
edition.workspace    = true
repository.workspace = true
homepage.workspace   = true
categories.workspace = true
keywords.workspace   = true

[[bin]]
name = "grammard"
path = "src/main.rs"
required-features = ["service"]

[[test]]
name = "grammard_cli"
path = "tests/grammard_cli.rs"
required-features = ["service"]

[[test]]
name = "exclusive_start"
path = "tests/exclusive_start.rs"
required-features = ["service"]

[[test]]
name = "session"
path = "tests/session.rs"
required-features = ["service"]

[features]
default = ["service"]
# grammard's command line over the runtime library. An embedding host builds
# without it.
service = ["dep:clap"]
# Test-only engine decls (__test_hang / __test_panic) for the lifecycle system
# tests; never enabled in a shipped build.
test-hooks = ["sourcetrait_grammar_engine/test-hooks"]

[dependencies]
clap = { workspace = true, optional = true }
futures-util.workspace = true
nix.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true

sourcetrait_common.workspace = true
sourcetrait_grammar_engine.workspace = true
sourcetrait_grammar_operator.workspace = true
sourcetrait_grammar_protocol.workspace = true
sourcetrait_grammar_scratch.workspace = true

[dev-dependencies]
directories.workspace = true
tempfile.workspace = true

sourcetrait_grammar_client.workspace = true

[package.metadata]
rein = "ai"
