[package]
name = "nutype"
description = "Nu type definitions as data"
version.workspace    = true
authors.workspace    = true
license.workspace    = true
edition.workspace    = true
repository.workspace = true
homepage.workspace   = true
categories.workspace = true
keywords.workspace   = true

[features]
default = ["nushell"]
# nushell's own shapes and types, converted to and from nutype's. The model,
# its text, and the values it holds to a type build without.
nushell = ["dep:nu-protocol", "nuval/nushell"]

[dependencies]
bitcode.workspace = true
nu-protocol = { workspace = true, optional = true }
nuval.workspace = true
rkyv.workspace = true
serde.workspace = true
snafu.workspace = true

sourcetrait_common.workspace = true

[dev-dependencies]
# nu-parser is the reference nutype's text is held to, reading a definition's
# signature with nu-cmd-lang's `def`; nu-engine's defaults pair its `os`
# feature with nu-protocol's, as in nuval.
nu-cmd-lang.workspace = true
nu-engine.workspace = true
nu-parser.workspace = true

[package.metadata]
rein = "ai"
