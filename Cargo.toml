[workspace]
resolver = "3"
members = [
  "crate/mcp",
  "tests",
]

[workspace.package]
version = "0.0.0-3"
edition = "2024"
authors = ["SourceTrait <development@sourcetrait.com"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/grammar_mcp"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "grammar"]

[workspace.dependencies]
bitcode = { version = "0.6" }
clap = { version = "4", features = ["derive"] }
directories = { version = "6" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
indoc = { version = "2" }
liquid = { version = "0.26" }
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }
rmcp = { version = "1.7", features = ["server", "transport-io", "schemars", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
schemars = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
shellexpand = "3"
tokio = { version = "1", features = ["macros", "process", "io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = { version = "0.8" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13" }

nu-cmd-extra = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-cmd-lang = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-cmd-plugin = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-command = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-config = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-engine = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-json = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-parser = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-path = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-plugin-engine = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nu-protocol = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }
nuon = { git = "https://github.com/nushell/nushell", tag = "0.115.1" }

sourcetrait_common = {
    path = "../sourcetrait_common/crates/sourcetrait_common",
    version = ">=0.0.0-0",
    default-features = false,
    features = [
        "agnostic",
        "cereal",
        "clapx",
        "datum",
        "subsys",
        "testing",
        "tomlx",
    ]
}

sourcetrait_cert_lib = { path = "../sourcetrait_cert/crates/sourcetrait_cert_lib" }

[profile.release]
# EmbedEngine principle 1 (grammar): eval runs in-process on host threads and a
# panicking body is caught by catch_unwind so it fails one eval, not the host. That
# REQUIRES unwinding - `panic = "abort"` would make the catch moot and a single bad
# body would take the whole MCP down. Pinned explicit as an invariant (it is also
# the default; the lock is to make any future change to abort a deliberate edit).
panic = "unwind"
