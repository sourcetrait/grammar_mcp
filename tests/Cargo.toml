[package]
name = "sourcetrait_grammar_tests"
description = "System tests SourceTrait Grammar"
version.workspace    = true
authors.workspace    = true
license.workspace    = true
edition.workspace    = true
repository.workspace = true
homepage.workspace   = true
categories.workspace = true
keywords.workspace   = true

[features]
# The lifecycle tests need the mcp binary built with ITS own `test-hooks` feature
# (__test_hang / __test_panic). Run both together:
#   cargo build -p sourcetrait_grammar_mcp --features test-hooks
#   cargo test -p sourcetrait_grammar_tests --features test-hooks -- --test-threads=1
test-hooks = []

[dependencies]
futures-util.workspace = true
nix.workspace = true
nu-config.workspace = true
# nuon takes nu-engine without its `os` feature, which nu-protocol's default
# turns on, and nu-engine then misses a field nu-protocol has; its default here
# unifies the two.
nu-engine.workspace = true
nu-json = { workspace = true, features = ["nu-protocol"] }
nu-protocol.workspace = true
nuon.workspace = true
serde_json.workspace = true
srcert_lib.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true

sourcetrait_common.workspace = true
